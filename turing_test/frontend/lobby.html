<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图灵测试 - 大厅</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="card lobby-card">
            <div class="header">
                <h1>🧪 图灵测试</h1>
                <div class="user-info">
                    <span id="userNickname"></span>
                    <button onclick="logout()" class="btn btn-sm">退出</button>
                </div>
            </div>

            <div id="matchingSection" style="display: none;">
                <div class="matching-animation">
                    <div class="spinner"></div>
                    <h2>正在匹配对手...</h2>
                    <p id="matchStatus">请稍候，我们正在为你寻找合适的对话者</p>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="wait-info">
                            <span id="waitTime">已等待 0 秒</span>
                        </div>
                    </div>
                    <div class="queue-info" id="queueInfo">
                        当前等待人数：<span id="waitingCount">--</span>
                    </div>
                </div>
                <button onclick="cancelMatching()" class="btn btn-secondary">取消匹配</button>
            </div>

            <div id="readySection">
                <h2>准备好开始了吗？</h2>
                <p class="description">
                    点击"开始匹配"后，你将进入匹配队列。<br>
                    系统会优先为你匹配真人对手，若等待超过 30 秒则自动匹配 AI。
                </p>

                <div class="stats-preview" id="statsPreview">
                    <!-- 统计数据将在这里显示 -->
                </div>

                <div class="queue-status" id="queueStatus">
                    <span class="status-dot"></span>
                    当前等待人数：<span id="currentWaiting">--</span> | 
                    活跃会话：<span id="activeSessions">--</span>
                </div>

                <button onclick="startMatching()" class="btn btn-primary btn-large">
                    🚀 开始匹配
                </button>

                <div class="mode-select">
                    <p>或者选择直接模式：</p>
                    <button onclick="matchAI()" class="btn btn-secondary">
                        🤖 直接匹配 AI
                    </button>
                </div>
            </div>

            <div id="foundSection" style="display: none;">
                <div class="success-animation">
                    <div class="checkmark">✓</div>
                </div>
                <h2>匹配成功！</h2>
                <p id="matchResult">正在进入聊天室...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        const MATCH_TIMEOUT = 30; // 秒
        let userId = localStorage.getItem('userId');
        let isMatching = false;
        let matchInterval = null;
        let waitTimer = null;
        let queueStatusInterval = null;
        let ws = null;
        let startTime = null;

        // 检查登录状态
        if (!userId) {
            window.location.href = '/';
        }

        // 显示用户信息
        document.getElementById('userNickname').textContent = localStorage.getItem('nickname') || '用户';

        // 加载统计和队列状态
        loadStats();
        loadQueueStatus();

        // 定时刷新队列状态
        queueStatusInterval = setInterval(loadQueueStatus, 5000);

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/api/stats/${userId}`);
                if (res.ok) {
                    const stats = await res.json();
                    document.getElementById('statsPreview').innerHTML = `
                        <div class="stat-item">
                            <span class="stat-value">${stats.total_sessions}</span>
                            <span class="stat-label">总对话数</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">${stats.ai_sessions}</span>
                            <span class="stat-label">AI 对手</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">${stats.human_sessions}</span>
                            <span class="stat-label">真人对手</span>
                        </div>
                        ${stats.total_guesses > 0 ? `
                        <div class="stat-item">
                            <span class="stat-value">${stats.accuracy}%</span>
                            <span class="stat-label">判断准确率</span>
                        </div>
                        ` : ''}
                    `;
                }
            } catch (e) {
                console.error('加载统计失败:', e);
            }
        }

        async function loadQueueStatus() {
            if (isMatching) return; // 匹配中时不更新
            try {
                const res = await fetch(`${API_BASE}/api/match/status`);
                if (res.ok) {
                    const status = await res.json();
                    document.getElementById('currentWaiting').textContent = status.waiting_count;
                    document.getElementById('activeSessions').textContent = status.active_sessions || 0;
                }
            } catch (e) {
                console.error('加载队列状态失败:', e);
            }
        }

        function connectWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}/ws/${userId}`);
            
            ws.onopen = () => {
                console.log('WebSocket 连接已建立');
            };
            
            ws.onmessage = (event) => {
                const data = event.data;
                if (typeof data === 'string') {
                    try {
                        const msg = JSON.parse(data);
                        handleWebSocketMessage(msg);
                    } catch (e) {
                        console.error('解析消息失败:', e);
                    }
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket 错误:', error);
            };
            
            ws.onclose = () => {
                console.log('WebSocket 连接已关闭');
                // 如果正在匹配，尝试重连
                if (isMatching) {
                    setTimeout(connectWebSocket, 2000);
                }
            };
        }

        function handleWebSocketMessage(msg) {
            if (msg.type === 'match_found') {
                // 匹配成功（可能是超时后自动匹配 AI）
                clearInterval(matchInterval);
                clearInterval(waitTimer);
                localStorage.setItem('sessionId', msg.session_id);
                localStorage.setItem('opponentType', msg.opponent_type);
                showFound(msg.opponent_type === 'ai' ? '已为您匹配 AI 对手' : '匹配成功！');
                setTimeout(() => {
                    window.location.href = '/chat';
                }, 1500);
            } else if (msg.type === 'match_timeout') {
                // 等待超时通知
                document.getElementById('matchStatus').textContent = msg.message;
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('progressFill').classList.add('timeout');
            }
        }

        async function startMatching() {
            if (isMatching) return;

            isMatching = true;
            startTime = Date.now();
            document.getElementById('readySection').style.display = 'none';
            document.getElementById('matchingSection').style.display = 'block';
            
            // 连接 WebSocket
            connectWebSocket();

            // 启动等待计时器
            startWaitTimer();

            try {
                const res = await fetch(`${API_BASE}/api/match`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: parseInt(userId) })
                });

                const data = await res.json();

                if (data.status === 'found') {
                    // 匹配成功
                    clearInterval(matchInterval);
                    clearInterval(waitTimer);
                    const totalTime = Math.floor((Date.now() - startTime) / 1000);
                    localStorage.setItem('sessionId', data.session_id);
                    localStorage.setItem('opponentType', data.opponent_type);
                    showFound(data.opponent_type === 'human' ? '匹配到真人对手！' : '已匹配 AI 对手', totalTime);
                    setTimeout(() => {
                        window.location.href = '/chat';
                    }, 1500);
                } else if (data.status === 'waiting') {
                    // 继续等待，轮询检查
                    matchInterval = setInterval(checkMatchStatus, 2000);
                }
            } catch (e) {
                console.error('匹配失败:', e);
                alert('匹配失败，请重试');
                resetMatching();
            }
        }

        function startWaitTimer() {
            let elapsed = 0;
            waitTimer = setInterval(() => {
                elapsed++;
                
                // 更新进度条（装饰性，30秒填满）
                const progress = Math.min(100, (elapsed / 30) * 100);
                document.getElementById('progressFill').style.width = progress + '%';
                
                // 更新时间显示
                document.getElementById('waitTime').textContent = `已等待 ${elapsed} 秒`;
            }, 1000);
        }

        async function checkMatchStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/match`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: parseInt(userId) })
                });

                const data = await res.json();

                if (data.status === 'found') {
                    clearInterval(matchInterval);
                    clearInterval(waitTimer);
                    const totalTime = Math.floor((Date.now() - startTime) / 1000);
                    localStorage.setItem('sessionId', data.session_id);
                    localStorage.setItem('opponentType', data.opponent_type);
                    showFound(data.opponent_type === 'human' ? '匹配到真人对手！' : '已匹配 AI 对手', totalTime);
                    setTimeout(() => {
                        window.location.href = '/chat';
                    }, 1500);
                }
            } catch (e) {
                console.error('检查匹配状态失败:', e);
            }
        }

        function cancelMatching() {
            if (matchInterval) {
                clearInterval(matchInterval);
            }
            if (waitTimer) {
                clearInterval(waitTimer);
            }
            if (ws) {
                ws.close();
                ws = null;
            }
            resetMatching();
        }

        function resetMatching() {
            isMatching = false;
            startTime = null;
            document.getElementById('matchingSection').style.display = 'none';
            document.getElementById('readySection').style.display = 'block';
            
            // 重置进度条
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('progressFill').classList.remove('warning', 'timeout');
        }

        function showFound(message, matchTime = null) {
            document.getElementById('matchingSection').style.display = 'none';
            document.getElementById('foundSection').style.display = 'block';
            if (matchTime !== null) {
                document.getElementById('matchResult').textContent = `${message}（用时 ${matchTime} 秒）`;
            } else {
                document.getElementById('matchResult').textContent = message;
            }
        }

        async function matchAI() {
            try {
                const res = await fetch(`${API_BASE}/api/match/ai`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: parseInt(userId) })
                });

                const data = await res.json();

                if (data.status === 'found') {
                    localStorage.setItem('sessionId', data.session_id);
                    localStorage.setItem('opponentType', data.opponent_type);
                    window.location.href = '/chat';
                }
            } catch (e) {
                console.error('匹配 AI 失败:', e);
                alert('匹配失败，请重试');
            }
        }

        function logout() {
            // 关闭 WebSocket 连接
            if (ws) {
                ws.close();
            }
            // 清除定时器
            if (matchInterval) clearInterval(matchInterval);
            if (waitTimer) clearInterval(waitTimer);
            if (queueStatusInterval) clearInterval(queueStatusInterval);
            
            localStorage.clear();
            window.location.href = '/';
        }

        // 页面关闭时清理
        window.addEventListener('beforeunload', () => {
            if (ws) ws.close();
            if (matchInterval) clearInterval(matchInterval);
            if (waitTimer) clearInterval(waitTimer);
            if (queueStatusInterval) clearInterval(queueStatusInterval);
        });
    </script>
</body>
</html>
