<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图灵测试 - 聊天</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <button onclick="goBack()" class="btn-back">←</button>
                <div class="chat-info">
                    <h2 id="opponentName">对话者</h2>
                    <span id="chatStatus" class="status-indicator">连接中...</span>
                </div>
            </div>
            <button onclick="endChat()" class="btn btn-sm btn-end">结束对话</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="system-message">
                <p>🎯 通过聊天判断对方是真人还是 AI</p>
                <p>至少对话 <span id="minTurnsDisplay">3</span> 轮后才能结束对话</p>
            </div>
            <!-- 消息将在这里动态添加 -->
        </div>

        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <span>对方正在输入...</span>
        </div>

        <div class="chat-input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="输入消息..." 
                autocomplete="off"
                @keyup.enter="sendMessage()"
            >
            <button onclick="sendMessage()" class="btn btn-primary">发送</button>
        </div>

        <!-- 结束对话确认弹窗 -->
        <div id="endModal" class="modal" style="display: none;">
            <div class="modal-content">
                <h3>结束对话</h3>
                <p id="endWarning">请多聊几句再结束哦～</p>
                <div class="modal-actions">
                    <button onclick="closeEndModal()" class="btn btn-secondary">继续聊天</button>
                    <button onclick="confirmEndChat()" class="btn btn-primary">确认结束</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const API_BASE = '';
        const userId = localStorage.getItem('userId');
        const sessionId = localStorage.getItem('sessionId');
        const opponentType = localStorage.getItem('opponentType');
        const MIN_CHAT_TURNS = 3; // 最少对话轮数，与后端 config.py 保持一致
        let ws = null;
        let messageCount = 0;
        let canEnd = false;

        // 检查会话
        if (!userId || !sessionId) {
            window.location.href = '/lobby';
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initChat();

            // 显示对手类型提示（仅用于调试，实际应该隐藏）
            const opponentNameEl = document.getElementById('opponentName');
            if (opponentType === 'ai') {
                opponentNameEl.textContent = '神秘对话者 🤖';
            } else {
                opponentNameEl.textContent = '神秘对话者 👤';
            }

            // 更新最小轮数显示
            document.getElementById('minTurnsDisplay').textContent = MIN_CHAT_TURNS;
        });

        function initChat() {
            // 加载历史消息
            loadMessages();
            
            // 连接 WebSocket
            connectWebSocket();
        }

        function loadMessages() {
            fetch(`${API_BASE}/api/session/${sessionId}`)
                .then(res => res.json())
                .then(data => {
                    const messages = data.messages || [];
                    renderMessages(messages);
                    messageCount = messages.length;
                    canEnd = messageCount >= MIN_CHAT_TURNS * 2; // 双方各 MIN_CHAT_TURNS 句
                })
                .catch(err => console.error('加载消息失败:', err));
        }

        function connectWebSocket() {
            const wsUrl = `ws://${window.location.host}/ws/${userId}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('chatStatus').textContent = '在线';
                document.getElementById('chatStatus').classList.add('online');
            };

            ws.onclose = () => {
                document.getElementById('chatStatus').textContent = '已断开';
                document.getElementById('chatStatus').classList.remove('online');
            };

            ws.onerror = (err) => {
                console.error('WebSocket 错误:', err);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };
        }

        function handleWebSocketMessage(data) {
            const messagesEl = document.getElementById('chatMessages');
            const typingEl = document.getElementById('typingIndicator');

            if (data.type === 'message') {
                const msg = data.data;
                // 检查是否已存在（避免重复）
                if (!document.getElementById(`msg-${msg.id}`)) {
                    appendMessage(msg);
                    messageCount++;
                    canEnd = messageCount >= MIN_CHAT_TURNS * 2;
                }
            } else if (data.type === 'typing') {
                typingEl.style.display = 'block';
                messagesEl.scrollTop = messagesEl.scrollHeight;
            } else if (data.type === 'stop_typing') {
                typingEl.style.display = 'none';
            }
        }

        function renderMessages(messages) {
            const messagesEl = document.getElementById('chatMessages');
            messagesEl.innerHTML = `
                <div class="system-message">
                    <p>🎯 通过聊天判断对方是真人还是 AI</p>
                    <p>至少对话 3 轮后才能结束对话</p>
                </div>
            `;
            
            messages.forEach(msg => appendMessage(msg));
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function appendMessage(msg) {
            const messagesEl = document.getElementById('chatMessages');
            const isSelf = msg.sender_id == userId;
            const isAI = msg.is_ai;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isSelf ? 'message-self' : 'message-other'}`;
            msgDiv.id = `msg-${msg.id}`;
            
            const senderName = isAI ? '对方 (AI?)' : (isSelf ? '你' : '对方');
            
            msgDiv.innerHTML = `
                <div class="message-sender">${senderName}</div>
                <div class="message-content">${escapeHtml(msg.content)}</div>
                <div class="message-time">${formatTime(msg.created_at)}</div>
            `;
            
            messagesEl.appendChild(msgDiv);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content || !ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            // 根据对手类型发送不同类型的消息
            const msgType = opponentType === 'human' ? 'human_chat' : 'chat';
            
            // 发送消息
            ws.send(JSON.stringify({
                type: msgType,
                content: content
            }));

            // 如果是真人，发送"正在输入"状态
            if (opponentType === 'human') {
                ws.send(JSON.stringify({
                    type: 'typing',
                    content: content
                }));
                // 2 秒后停止输入提示
                setTimeout(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: 'stop_typing'
                        }));
                    }
                }, 2000);
            }

            input.value = '';
        }

        function endChat() {
            const modal = document.getElementById('endModal');
            const warning = document.getElementById('endWarning');

            if (!canEnd) {
                const currentTurns = Math.floor(messageCount / 2);
                warning.textContent = `请多聊几句再结束哦～（当前 ${currentTurns}/${MIN_CHAT_TURNS} 轮）`;
                warning.style.color = '#ff9800';
            } else {
                warning.textContent = '确定要结束这次对话吗？';
                warning.style.color = '#666';
            }

            modal.style.display = 'flex';
        }

        function closeEndModal() {
            document.getElementById('endModal').style.display = 'none';
        }

        async function confirmEndChat() {
            if (!canEnd) {
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/session/${sessionId}/end`, {
                    method: 'POST'
                });
                if (!res.ok) {
                    alert('结束会话失败，请重试');
                    return;
                }
            } catch (e) {
                console.error('结束会话失败:', e);
                alert('结束会话失败，请重试');
                return;
            }

            // 跳转到问卷页面
            window.location.href = '/result';
        }

        function goBack() {
            if (confirm('确定要离开当前对话吗？未完成的对话将不会被记录。')) {
                window.location.href = '/lobby';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
