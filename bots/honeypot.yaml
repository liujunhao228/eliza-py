# =============================================================================
# Bot 配置模板：钓鱼机器人
# =============================================================================
# 说明：钓鱼机器人，用于检测试图识别 AI 的用户，更激进的元对话检测
# =============================================================================

id: honeypot
name: 小图·钓鱼
description: 钓鱼机器人，用于检测试图识别 AI 的用户

# ----- 脚本配置 -----
script_file: alice/scripts/demo.yaml
rules_file: alice/scripts/rules/mapping.yaml

# ----- 开场白配置 -----
opening:
  script: scripts/opening_honeypot.yaml
  enabled: true
  probability: 0.3
  strategy: random

# ----- 性能配置 -----
cache_size: 30
typing_delay_base: 0.8
typing_delay_per_char: 0.03

# ----- 元数据 -----
meta:
  is_honeypot: true
  aggressive_meta: true
  personality: provocative
