# =============================================================================
# Bot 配置模板：慢速 Bot
# =============================================================================
# 说明：慢速 Bot，模拟思考时间更长
# =============================================================================

id: slow
name: 小图·慢速
description: 慢速 Bot，模拟思考时间更长

# ----- 脚本配置 -----
script_file: scripts/yaml/demo.yaml
rules_file: scripts/mapping/mapping.yaml

# ----- 开场白配置 -----
opening:
  script: scripts/opening.yaml
  enabled: true
  probability: 0.8
  strategy: random

# ----- 性能配置 -----
cache_size: 50
typing_delay_base: 2.0
typing_delay_per_char: 0.08

# ----- 元数据 -----
meta:
  is_honeypot: false
  aggressive_meta: false
  personality: thoughtful
