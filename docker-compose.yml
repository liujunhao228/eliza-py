# =============================================================================
# Eliza-Py Docker Compose 配置文件
# =============================================================================
# 快速开始:
#   docker compose up -d
#
# 停止服务:
#   docker compose down
#
# 查看日志:
#   docker compose logs -f
#
# 重启服务:
#   docker compose restart
#
# 重建镜像:
#   docker compose up -d --build
# =============================================================================

services:
  eliza-py:
    # 本地构建
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建参数（可选）
        - BUILDKIT_INLINE_CACHE=1
    
    # 或者使用已构建的镜像（取消注释使用）
    # image: eliza-py:latest
    
    container_name: eliza-py
    
    # 重启策略
    restart: unless-stopped
    
    # 端口映射
    ports:
      - "${HOST_PORT:-8000}:8000"
    
    # 环境变量
    environment:
      # 服务端口（容器内部）
      - PORT=8000
      
      # 运行模式：turing (默认) 或 alice
      - RUN_MODE=${RUN_MODE:-turing}
      
      # 日志配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      
      # =======================================================================
      # ⚠️ 生产环境必须修改以下密钥
      # =======================================================================
      
      # JWT 认证密钥 - 生产环境必须修改！
      # 生成方法：python -c "import secrets; print(secrets.token_urlsafe(32))"
      - CONFIG_TURING_AUTH_SECRET_KEY=${CONFIG_TURING_AUTH_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      
      # 数据导出 API 密钥 - 推荐设置
      - TURING_ADMIN_API_KEY=${TURING_ADMIN_API_KEY:-}
      
      # =======================================================================
      # 可选配置
      # =======================================================================
      
      # 服务器配置
      - CONFIG_TURING_SERVER_HOST=0.0.0.0
      - CONFIG_TURING_SERVER_PORT=8000
      
      # 数据库配置
      - CONFIG_TURING_DATABASE_URL=sqlite:///data/turing.db
      
      # CORS 配置（生产环境必填）
      # - CONFIG_TURING_CORS_ORIGINS=https://your-domain.com
      
      # Sentry 错误追踪（可选）
      # - SENTRY_DSN=${SENTRY_DSN:-}
      # - SENTRY_ENABLED=${SENTRY_ENABLED:-false}
      
      # 启动备份
      - ENABLE_STARTUP_BACKUP=${ENABLE_STARTUP_BACKUP:-true}
    
    # 数据卷持久化
    volumes:
      # 数据库持久化
      - eliza_data:/app/data
      # 日志持久化（可选）
      - ./logs:/app/logs
    
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import os, socket; port=int(os.getenv('PORT', 8000)); s=socket.socket(); s.settimeout(5); result=s.connect_ex(('127.0.0.1', port)); s.close(); exit(0 if result==0 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # 资源限制（可选）
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M
    
    # 网络配置
    networks:
      - eliza-network
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# 网络配置
# =============================================================================
networks:
  eliza-network:
    driver: bridge
    name: eliza-network

# =============================================================================
# 数据卷配置
# =============================================================================
volumes:
  eliza_data:
    driver: local
    name: eliza-py-data
