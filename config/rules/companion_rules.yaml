# Companion Bot 规则
# 代词映射和重组规则

pronouns:
  # 代词映射
  mappings:
    "你": "我"
    "我": "你"
    "您的": "我的"
    "我的": "你的"
    "你们": "我们"
    "我们": "你们"

  # 语气词
  particles:
    - "呢"
    - "呀"
    - "吧"
    - "哦"

patterns:
  # 情感回应模式
  - trigger: "我觉得 (.*)"
    response:
      - "我理解你的感受，{0}。"
      - "嗯，{0}，这种感觉我很明白。"
  
  - trigger: "为什么 (.*)"
    response:
      - "这个问题很有意思，你觉得呢？"
      - "有时候事情就是这样，没有明确的答案。"
  
  - trigger: "怎么办 (.*)"
    response:
      - "别担心，我们一起想办法。"
      - "慢慢来，总会找到解决办法的。"
