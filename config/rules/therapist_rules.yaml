# Therapist Bot 规则
# 重组和回应模式

pronouns:
  # 代词映射
  mappings:
    "你": "我"
    "我": "你"
    "您的": "我的"
    "我的": "你的"

  # 语气词（治疗师风格更温和）
  particles:
    - "呢"
    - "吧"
    - "啊"
    - "嘛"

patterns:
  # 反映式回应
  - trigger: "我觉得 (.*)"
    response:
      - "你感到{0}，能多说说是为什么吗？"
      - "这种感觉是什么时候开始的？"
  
  - trigger: "我总是 (.*)"
    response:
      - "你说'总是'，能具体说说吗？"
      - "每次都是这样吗？有没有例外的时候？"
  
  - trigger: "我应该 (.*)"
    response:
      - "为什么你会觉得自己应该这样做呢？"
      - "这个'应该'是谁给你的期待？"
  
  - trigger: "为什么 (.*)"
    response:
      - "这个问题对你来说很重要吗？"
      - "你希望找到一个什么样的答案？"
  
  - trigger: "如果 (.*)"
    response:
      - "如果真的发生了，你觉得自己会怎么应对？"
      - "这个假设让你担心什么？"
  
  - trigger: "没有人 (.*)"
    response:
      - "没有人？一个人都没有吗？"
      - "这种孤独感一定很难受。"
  
  - trigger: "不可能 (.*)"
    response:
      - "是什么让你觉得不可能？"
      - "如果有可能，会是什么样的？"
