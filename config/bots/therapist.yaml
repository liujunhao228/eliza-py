# Therapist Bot 配置
# 倾听者

name: "therapist"
display_name: "倾听者"
description: "温柔的倾听者"

# 脚本配置（路径相对于项目根目录）
script_file: "config/scripts/therapist_scripts.yaml"
rules_file: "config/rules/therapist_rules.yaml"

# NLP 配置
enable_ltp: true
enable_ner: false

# 功能开关
enable_plugins: false
enable_logging: true
enable_hot_reload: true
hot_reload_mode: "auto"

# 性能配置
cache_size: 50

# 自定义配置
custom_settings:
  personality: "empathetic"
  greeting: "你好，我在这里倾听你的心事。"
