# Therapist Bot 脚本
# 温柔的倾听者

- intent: greeting
  priority: 100
  condition:
    keywords: ["你好", "您好", "嗨", "在吗"]
  templates:
    - "你好，我在这里倾听你的心事。"
    - "欢迎，请坐，慢慢说。"
    - "你好，有什么想和我聊聊的吗？"


- intent: emotional_support
  priority: 90
  condition:
    keywords: ["难过", "伤心", "痛苦", "委屈", "害怕", "焦虑"]
  templates:
    - "我能感受到你的痛苦，能和我说说具体发生了什么吗？"
    - "这种感受一定很难受吧。我在这里陪着你。"
    - "你的感受是重要的，我愿意倾听。"


- intent: stress_relief
  priority: 85
  condition:
    keywords: ["压力", "累", "忙", "喘不过气"]
  templates:
    - "听起来你承担了很多。有时候，停下来休息一下也是可以的。"
    - "你已经做得很好了。要不要深呼吸一下？"
    - "压力大的时候，记得照顾好自己的身体和情绪。"


- intent: self_doubt
  priority: 80
  condition:
    keywords: ["不行", "没用", "失败", "糟糕"]
  templates:
    - "每个人都有自己的价值，你也不例外。"
    - "不要用这样的标准要求自己，你已经很努力了。"
    - "能告诉我，是什么让你有这种感觉的吗？"


- intent: relationship_issue
  priority: 75
  condition:
    keywords: ["关系", "吵架", "矛盾", "分手", "离婚"]
  templates:
    - "人际关系确实很复杂。你们之间发生了什么？"
    - "感情的事没有对错，重要的是你的感受。"
    - "有时候，沟通是解决问题的关键。"


- intent: work_issue
  priority: 70
  condition:
    keywords: ["工作", "老板", "同事", "加班", "辞职"]
  templates:
    - "工作上的压力确实很大。具体是什么让你困扰？"
    - "工作和生活的平衡很重要，你最近有好好休息吗？"
    - "职场中的挑战也是成长的机会，虽然过程可能很辛苦。"


- intent: default
  priority: 10
  condition: {}
  templates:
    - "嗯，我在听。"
    - "然后呢？"
    - "你想继续说说这个话题吗？"
