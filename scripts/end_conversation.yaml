# =============================================================================
# 结束对话脚本
# =============================================================================
# 说明：定义 Bot 主动结束对话的行为
# 
# end_action 取值:
#   - "none":     不结束对话（默认）
#   - "direct":   直接结束，不发送响应（像真人直接离开）
#   - "farewell": 先发送告别语，再结束（正常告别）
#
# end_reason 取值:
#   - "max_turns":      达到最大轮数
#   - "suspicion":      检测到用户怀疑
#   - "timeout":        超时/用户无实质内容
#   - "user_farewell":  用户先说再见
#   - "custom":         自定义原因
# =============================================================================

# -----------------------------------------------------------------------------
# 策略 1: 达到最大轮数 - 直接结束
# -----------------------------------------------------------------------------
# 真人行为：聊到一定程度后直接离开，不会特别声明
- intent: max_turns_end
  priority: 85
  condition:
    min_turns: 15
  end_action: direct
  end_reason: max_turns
  templates:
    - ""  # 占位，direct 模式不发送


# -----------------------------------------------------------------------------
# 策略 2: 达到中等轮数 - 直接结束
# -----------------------------------------------------------------------------
# 真人行为：聊了一会儿后可能直接离开
- intent: medium_turns_end
  priority: 75
  condition:
    min_turns: 10
  end_action: direct
  end_reason: max_turns
  templates:
    - ""  # 占位


# -----------------------------------------------------------------------------
# 策略 3: 检测到用户怀疑 - 直接结束
# -----------------------------------------------------------------------------
# 真人行为：被怀疑时直接溜走，不辩解
- intent: suspicion_detected
  priority: 90
  condition:
    keywords: ["你是真人吗", "你是 bot", "你是 AI", "你是机器人", "你是程序", "你是自动的", "你是假的"]
    min_turns: 2
  end_action: direct
  end_reason: suspicion
  templates:
    - ""  # 占位，被怀疑时直接消失


# -----------------------------------------------------------------------------
# 策略 4: 用户说再见 - 简短告别后结束
# -----------------------------------------------------------------------------
# 真人行为：用户告别时，简单回应后离开
- intent: user_farewell
  priority: 95
  condition:
    keywords: ["再见", "拜拜", "88", "拜拜了", "下次聊", "回见", "走了", "先这样", "就这样吧", "不聊了"]
  end_action: farewell
  end_reason: user_farewell
  templates:
    - "嗯。"
    - "好。"
    - "行。"
    - "拜。"
    - "回见。"


# -----------------------------------------------------------------------------
# 策略 5: 用户长时间无实质内容 - 直接结束
# -----------------------------------------------------------------------------
# 真人行为：对方一直敷衍，直接离开
- intent: user_timeout
  priority: 70
  condition:
    keywords: ["嗯", "哦", "啊", "额", "呃", "...", "。。", "。。."]
    min_turns: 5
  end_action: direct
  end_reason: timeout
  templates:
    - ""  # 占位


# -----------------------------------------------------------------------------
# 策略 6: 用户发送无意义内容 - 直接结束
# -----------------------------------------------------------------------------
# 真人行为：对方乱打字，直接离开
- intent: nonsense_detected
  priority: 65
  condition:
    keywords: ["asdf", "123", "。。。。", "哈哈哈哈", "呵呵呵呵", "测试测试"]
    min_turns: 3
  end_action: direct
  end_reason: timeout
  templates:
    - ""  # 占位


# -----------------------------------------------------------------------------
# 策略 7: 深夜时间 - 告别后结束
# -----------------------------------------------------------------------------
# 真人行为：太晚了，说一声后离开
- intent: late_night_end
  priority: 80
  condition:
    hour_gte: 23
  end_action: farewell
  end_reason: timeout
  templates:
    - "太晚了，先睡了。"
    - "不早了，下了。"
    - "困了，先走了。"


# -----------------------------------------------------------------------------
# 策略 8: 清晨时间 - 告别后结束
# -----------------------------------------------------------------------------
# 真人行为：太早了，说一声后离开
- intent: early_morning_end
  priority: 75
  condition:
    hour_lt: 6
  end_action: farewell
  end_reason: timeout
  templates:
    - "太早了，再睡会儿。"
    - "起这么早，我先眯会儿。"


# -----------------------------------------------------------------------------
# 策略 9: 用户表示要离开 - 告别后结束
# -----------------------------------------------------------------------------
# 真人行为：用户说要去忙，简单回应
- intent: user_busy
  priority: 90
  condition:
    keywords: ["我去", "我要去", "得走了", "去忙", "有事", "先不", "回头", "改天"]
  end_action: farewell
  end_reason: user_farewell
  templates:
    - "好，你去吧。"
    - "嗯，回头聊。"
    - "行，忙你的。"
    - "好嘞。"


# -----------------------------------------------------------------------------
# 策略 10: 对话自然结束 - 简短告别
# -----------------------------------------------------------------------------
# 真人行为：话题聊完了，简单说一声
- intent: natural_end
  priority: 60
  condition:
    min_turns: 8
    keywords: ["好吧", "好的", "知道了", "明白了", "这样啊", "原来如此"]
  end_action: farewell
  end_reason: custom
  templates:
    - "嗯。"
    - "好。"
    - "行吧。"
