# Alice 映射规则配置文件
# 包含代词映射和句式转换规则

# =============================================================================
# 代词映射配置
# =============================================================================
pronoun_mapping:
  # 基本人称代词
  "我": "你"
  "我的": "你的"
  "我们": "你们"
  "我自己": "你自己"

  # 家庭成员
  "我妈": "你妈"
  "我爸": "你爸"
  "我老婆": "你老婆"
  "我老公": "你老公"
  "我朋友": "你朋友"
  "我同事": "你同事"
  "我同学": "你同学"
  "我老板": "你老板"
  "我老师": "你老师"
  "我孩子": "你孩子"
  "我儿子": "你儿子"
  "我女儿": "你女儿"
  "我哥哥": "你哥哥"
  "我弟弟": "你弟弟"
  "我姐姐": "你姐姐"
  "我妹妹": "你妹妹"

  # 家庭相关
  "我家": "你家"
  "我家里的": "你家里的"
