# =============================================================================
# Turing 测试模块配置
# =============================================================================
# 说明：此文件包含 Turing 测试模块的所有配置项
# =============================================================================

# -----------------------------------------------------------------------------
# 数据库配置
# -----------------------------------------------------------------------------
database:
  url: sqlite:///data/turing.db
  # 连接池配置（仅适用于 PostgreSQL/MySQL，SQLite 使用特殊处理）
  pool:
    size: 20              # 连接池大小
    max_overflow: 40      # 最大溢出连接数
    recycle: 3600         # 连接回收时间（秒）
    timeout: 30           # 获取连接超时时间（秒）

# -----------------------------------------------------------------------------
# 认证配置
# -----------------------------------------------------------------------------
auth:
  invite_code_length: 6
  access_token_expire_minutes: 10080        # 7 天 (60 * 24 * 7)
  algorithm: HS256
  # ⚠️ 安全提示：生产环境必须通过环境变量 CONFIG_TURING_AUTH_SECRET_KEY 设置密钥
  # 可使用以下命令生成随机密钥：
  #   - Linux/Mac: openssl rand -base64 32
  #   - Python: import secrets; print(secrets.token_urlsafe(32))
  secret_key: "${CONFIG_TURING_AUTH_SECRET_KEY:CHANGE_ME_IN_PRODUCTION}"
  initial_score: 100

# -----------------------------------------------------------------------------
# 匹配配置（简化版）
# -----------------------------------------------------------------------------
match:
  timeout: 30                         # 保留字段（兼容配置验证）
  fixed_wait_time: 3                  # 前端固定等待时间（秒）
  ai_control_group_rate: 0.2          # 20% AI 对照组
  honeypot_probability: 0.15          # 15% 的 AI 匹配是钓鱼机器人

# -----------------------------------------------------------------------------
# 元对话关键词配置（统一用于元对话检测和场中判断触发）
# -----------------------------------------------------------------------------
meta_keywords:
  - '真人'
  - '机器'
  - 'AI'
  - '机器人'
  - '人工智能'
  - '人机'
  - '人类'
  - '人'
  - '电脑'
  - '计算'

# -----------------------------------------------------------------------------
# 场中判断配置
# -----------------------------------------------------------------------------
mid_game:
  enabled: true
  # 触发关键词（使用 meta_keywords 统一列表）
  multiplier_correct: 2.0             # 判断正确倍数
  multiplier_wrong: 1.5               # 判断错误倍数
  max_per_session: 1                  # 每局最多触发次数

# -----------------------------------------------------------------------------
# 积分配置
# -----------------------------------------------------------------------------
score:
  entry_fee: 2                        # 入场券
  min_free_turns: 3                   # 免费轮数
  turn_penalty_rate: 0.5              # 轮数惩罚率（分/轮）
  # 基础奖励/惩罚
  base_reward:
    ai_correct: 10                    # 识别 AI 正确
    ai_wrong: -15                     # 误判 AI
    human_correct: 20                 # 识别真人正确
    human_wrong: -10                  # 误判真人
    honeypot_correct: 30              # 识破钓鱼机器人（场中判断）
    honeypot_wrong: -50               # 被钓鱼机器人欺骗
  # 信心等级乘数
  confidence_multiplier:
    low: 1.0
    mid: 2.5
    high: 5.0
  # 元对话乘数
  meta_multiplier:
    correct_rate: 0.2                 # 判断正确时每次元对话增加 20%
    wrong_rate: 0.3                   # 判断错误时每次元对话增加 30%

# -----------------------------------------------------------------------------
# AI Bot 配置（默认，具体模板在 bots/ 目录下配置）
# -----------------------------------------------------------------------------
ai_bot:
  name: 小图

  # === 基础延迟 (向后兼容) ===
  typing_delay_base: 1.0              # 基础延迟 (秒)

  # === 回复延迟配置（随机范围）===
  reply_delay_min: 1.0                # 最小延迟（秒）
  reply_delay_max: 3.0                # 最大延迟（秒）

  # === 开场白配置 ===
  opening:
    enabled: true                     # 是否启用开场白
    probability: 0.7                  # 发送概率 (70%)
    delay_min: 2.0                    # 最小延迟 (秒)
    delay_max: 5.0                    # 最大延迟 (秒)
    
    # 钓鱼机器人专用配置
    honeypot:
      probability: 0.5                # 发送概率 (50%)
      delay_min: 5.0                  # 延迟更长
      delay_max: 15.0

  # === 每字符延迟 ===
  typing_delay_per_char: 0.05         # 每字符额外延迟（秒）

  # === 钓鱼机器人延迟配置 ===
  honeypot:
    reply_delay_min: 2.0              # 钓鱼机器人回复更慢
    reply_delay_max: 8.0
    opening_delay_min: 5.0            # 开场白也更慢
    opening_delay_max: 15.0

    # 拟真行为：偶尔出现超长延迟（模拟人类分心）
    occasional_long_delay_probability: 0.1
    occasional_long_delay_min: 15.0
    occasional_long_delay_max: 60.0

    # 元对话时延迟乘数（模拟思考）
    meta_delay_multiplier: 1.5

    # 会话早期延迟乘数（建立人设）
    early_session_delay_multiplier: 1.3

# -----------------------------------------------------------------------------
# 会话配置
# -----------------------------------------------------------------------------
session:
  min_chat_turns: 3                   # 最少对话轮数才能结束

# -----------------------------------------------------------------------------
# 服务器配置
# -----------------------------------------------------------------------------
server:
  host: 0.0.0.0
  port: 8000

# -----------------------------------------------------------------------------
# NLP 服务配置
# -----------------------------------------------------------------------------
nlp_service:
  enable_ltp: false
  cache_size: 1000
  cache_ttl: 3600

# -----------------------------------------------------------------------------
# Bot 池配置
# -----------------------------------------------------------------------------
bot_pool:
  min_instances: 2
  max_instances: 10
  idle_timeout: 300
  max_concurrent: 100
  default_template: "default"         # 默认使用的 Bot 模板 ID
  # Bot 模板从 bots/ 目录加载，不再在此处定义 ai_bot_templates

# -----------------------------------------------------------------------------
# AliceBot 配置 (供 Turing 使用)
# -----------------------------------------------------------------------------
alice_bot:
  cache_size: 50
  context_max_turns: 20
  script_file: alice/scripts/demo.yaml
  rules_file: alice/scripts/rules/mapping.yaml

# -----------------------------------------------------------------------------
# 性能配置
# -----------------------------------------------------------------------------
performance:
  response_timeout: 10.0
  max_input_length: 500
  base_typing_delay: 0.5
  chars_per_second: 5.0

# -----------------------------------------------------------------------------
# WebSocket 配置
# -----------------------------------------------------------------------------
websocket:
  ping_interval: 20                   # 心跳间隔 (秒)
  ping_timeout: 30                    # 心跳超时 (秒)

# -----------------------------------------------------------------------------
# 日志配置
# -----------------------------------------------------------------------------
log:
  level: INFO
  file: logs/turing.log
  max_size_mb: 10
  backup_count: 5
