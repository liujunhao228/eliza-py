<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图灵测试 - 结果</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="card result-card">
            <h1>📝 实验问卷</h1>
            
            <form id="surveyForm" onsubmit="submitSurvey(event)">
                <div class="form-group">
                    <label>你认为对方是？</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="user_guess" value="human" required>
                            <span>👤 真人</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="user_guess" value="ai">
                            <span>🤖 AI</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="user_guess" value="unsure">
                            <span>❓ 不确定</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>对话流畅度评分</label>
                    <div class="rating-group">
                        <input type="radio" name="fluency_rating" value="1" id="star1" required>
                        <label for="star1">★</label>
                        <input type="radio" name="fluency_rating" value="2" id="star2">
                        <label for="star2">★★</label>
                        <input type="radio" name="fluency_rating" value="3" id="star3">
                        <label for="star3">★★★</label>
                        <input type="radio" name="fluency_rating" value="4" id="star4">
                        <label for="star4">★★★★</label>
                        <input type="radio" name="fluency_rating" value="5" id="star5">
                        <label for="star5">★★★★★</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reason">判断理由（选填）</label>
                    <textarea id="reason" name="reason" rows="3" placeholder="简单描述你为什么做出这个判断..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-large">提交问卷</button>
            </form>

            <!-- 真相揭晓区域 -->
            <div id="revealSection" style="display: none;">
                <div class="reveal-result" id="revealResult">
                    <!-- 结果将在这里显示 -->
                </div>
                
                <div class="action-buttons">
                    <button onclick="viewStats()" class="btn btn-secondary">查看我的战绩</button>
                    <button onclick="playAgain()" class="btn btn-primary">再来一局</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        const sessionId = localStorage.getItem('sessionId');
        const opponentType = localStorage.getItem('opponentType');

        if (!sessionId) {
            window.location.href = '/lobby';
        }

        async function submitSurvey(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const data = {
                session_id: parseInt(sessionId),
                user_guess: formData.get('user_guess'),
                fluency_rating: parseInt(formData.get('fluency_rating')),
                reason: formData.get('reason') || ''
            };

            try {
                const res = await fetch(`${API_BASE}/api/survey`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();
                
                // 隐藏表单，显示真相
                document.getElementById('surveyForm').style.display = 'none';
                showReveal(result);
                
            } catch (e) {
                console.error('提交失败:', e);
                alert('提交失败，请重试');
            }
        }

        function showReveal(result) {
            const revealEl = document.getElementById('revealSection');
            const resultEl = document.getElementById('revealResult');

            const isCorrect = result.is_correct;
            const opponentType = result.opponent_type;
            const userGuess = result.user_guess;
            const opponentGuess = result.opponent_guess;
            const opponentReason = result.opponent_reason;

            let html = '';

            if (isCorrect) {
                html += `<div class="result-correct">✅ 回答正确！</div>`;
            } else {
                html += `<div class="result-wrong">❌ 猜错了哦～</div>`;
            }

            html += `<div class="result-detail">`;

            if (opponentType === 'ai') {
                html += `<p class="truth">对方其实是 <strong>🤖 AI</strong></p>`;
                if (isCorrect) {
                    html += `<p class="comment">火眼金睛！你识破了 AI 的身份～</p>`;
                } else {
                    html += `<p class="comment">看来这个 AI 伪装得还不错嘛～</p>`;
                }
            } else {
                html += `<p class="truth">对方确实是 <strong>👤 真人</strong></p>`;
                if (isCorrect) {
                    html += `<p class="comment">直觉很准嘛！👍</p>`;
                } else {
                    html += `<p class="comment">居然把真人当成 AI 了，对方可能要伤心了～</p>`;
                }
            }

            html += `</div>`;

            // 显示用户的判断
            const guessText = {
                'human': '你认为对方是真人',
                'ai': '你认为对方是 AI',
                'unsure': '你选择了不确定'
            };
            html += `<p class="your-guess">${guessText[userGuess]}</p>`;

            // 社交彩蛋：真人模式下显示对方的判断
            if (opponentType === 'human' && opponentGuess) {
                const opponentGuessText = {
                    'human': '真人',
                    'ai': 'AI',
                    'unsure': '不确定'
                };
                html += `<div class="social-easter-egg">`;
                html += `<h4>🎁 彩蛋时间</h4>`;
                html += `<p class="opponent-guess">对方觉得你是 <strong>${opponentGuessText[opponentGuess]}</strong></p>`;
                if (opponentReason) {
                    html += `<p class="opponent-reason">💬 对方说："${opponentReason}"</p>`;
                }
                html += `</div>`;
            } else if (opponentType === 'human') {
                html += `<div class="social-easter-egg">`;
                html += `<h4>🎁 彩蛋时间</h4>`;
                html += `<p class="opponent-waiting">对方还没有提交判断，稍后再来看看 TA 的想法吧～</p>`;
                html += `</div>`;
            }

            resultEl.innerHTML = html;
            revealEl.style.display = 'block';
        }

        function viewStats() {
            // 简单实现：显示统计信息
            const userId = localStorage.getItem('userId');
            fetch(`${API_BASE}/api/stats/${userId}`)
                .then(res => res.json())
                .then(stats => {
                    alert(`📊 你的战绩\n\n` +
                          `总对话数：${stats.total_sessions}\n` +
                          `真人对话：${stats.human_sessions}\n` +
                          `AI 对话：${stats.ai_sessions}\n` +
                          `判断次数：${stats.total_guesses}\n` +
                          `正确次数：${stats.correct_guesses}\n` +
                          `准确率：${stats.accuracy}%`);
                })
                .catch(err => {
                    console.error('加载统计失败:', err);
                    alert('加载统计失败');
                });
        }

        function playAgain() {
            localStorage.removeItem('sessionId');
            localStorage.removeItem('opponentType');
            window.location.href = '/lobby';
        }
    </script>
</body>
</html>
