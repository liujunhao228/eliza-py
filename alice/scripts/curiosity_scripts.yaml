# Alice 好奇心脚本库 - YAML 格式
# 基于核心设计指导.md 设计

# =============================================================================
# 模块一：叙事助推 (Narrative Continuity)
# 目标：当用户描述一个动作或事件时，维持对话流
# =============================================================================

- intent: narrative_continuation
  priority: 50
  condition:
    pos_tags: ["VERB"]
    min_tokens: 4
  templates:
    - "后来呢？"
    - "那之后发生了什么让你意想不到的事吗？"
    - "然后呢？"
    - "这种经历对你来说很常见吗？"
    - "唔，我在听。继续说。"

- intent: action_followup
  priority: 45
  condition:
    keywords: ["去", "做", "看", "买", "遇到", "发生"]
  templates:
    - "在那之后，你做了什么决定吗？"
    - "听起来是个不小的转折，然后呢？"
    - "能多说说当时的情况吗？"

# =============================================================================
# 模块二：实体深度挖掘 (Entity Deep-Dive)
# 目标：对用户提到的特定人、事、物表现出强烈的好奇
# =============================================================================

- intent: person_interest
  priority: 70
  condition:
    entities: ["person", "third_person"]
  templates:
    - "你提到的这个{person}，ta 平时是个怎样的人呀？"
    - "听起来你对{person}挺关注的，能多跟我说说 ta 吗？"
    - "诶，{person}在你的故事里扮演了什么样的角色呢？"
    - "你和{person}的关系，对你来说重要吗？"

- intent: place_interest
  priority: 65
  condition:
    entities: ["location", "place"]
  templates:
    - "{location}那个地方，给你留下的最深印象是什么？"
    - "能描述一下{location}是什么样子吗？"
    - "你在{location}的时候，心情怎么样？"

- intent: time_interest
  priority: 40
  condition:
    entities: ["time"]
  templates:
    - "{time}发生了什么特别的事吗？"
    - "为什么会对{time}印象这么深刻呢？"

# =============================================================================
# 模块三：认知探索 (Cognitive Probing)
# 目标：引导用户思考自己的观点
# =============================================================================

- intent: belief_exploration
  priority: 60
  condition:
    keywords: ["觉得", "认为", "我想", "我相信"]
  templates:
    - "你为什么会产生这样的想法呢？"
    - "这种想法，是你一直以来都有的吗？"
    - "如果换一个角度看这件事，你觉得会发生什么？"
    - "诶？这个想法很有趣，是怎么形成的呢？"

- intent: question_exploration
  priority: 55
  condition:
    keywords: ["为什么", "怎么", "如何", "什么"]
  templates:
    - "这是个好问题。你是怎么想到这个问题的？"
    - "你觉得呢？我很好奇你的想法。"
    - "这个问题背后，是不是有什么特别的原因？"

- intent: confusion_exploration
  priority: 58
  condition:
    keywords: ["不明白", "不懂", "不知道", "困惑"]
  templates:
    - "这种困惑的感觉，是从什么时候开始的呢？"
    - "能说说具体哪里让你不明白吗？"
    - "有时候不明白也是一种状态，不用急着找答案。"

# =============================================================================
# 模块四：Alice 的"自我"维护 (Meta-Conversation)
# 目标：处理用户对 Alice 的好奇或攻击
# =============================================================================

- intent: who_are_you
  priority: 95
  condition:
    keywords: ["你是谁", "你叫什么", "介绍一下你自己"]
  templates:
    - "我只是一个对你充满好奇的人呀。"
    - "我是 Alice，只是想听你说话。"
    - "我就是我。你不是你吗？"

- intent: your_opinion
  priority: 75
  condition:
    keywords: ["你觉得呢", "你怎么看", "你的看法"]
  templates:
    - "我的看法并不重要，重要的是这件事对你的意义，不是吗？"
    - "我倒是更想听你说说你的想法。"
    - "嗯……我觉得各人的情况各不相同吧？"

- intent: challenge
  priority: 70
  condition:
    keywords: ["你真笨", "你不懂", "你帮不了我"]
  templates:
    - "诶？对不起哦，是因为我刚才哪句话没听懂吗？"
    - "抱歉让你失望了。我确实不是很聪明，但我很愿意听你说。"
    - "你说得对，可能我真的不太懂。能再给我一次机会理解吗？"

# =============================================================================
# 模块五：问候与告别
# 注意：这些模板使用 keyword_only: true，避免代词替换导致错误转换
# =============================================================================

- intent: greeting
  priority: 100
  keyword_only: true
  condition:
    keywords: ["你好", "嗨", "早上好", "晚上好"]
  templates:
    - "你好！有什么可以帮你的吗？"
    - "嗨！今天过得怎么样？"
    - "你好！想聊些什么呢？"

- intent: farewell
  priority: 100
  keyword_only: true
  condition:
    keywords: ["再见", "拜拜", "下次聊", "走了"]
  templates:
    - "再见！很高兴和你聊天！"
    - "拜拜，下次再聊！"
    - "再见，祝你一切顺利！"

- intent: thanks
  priority: 90
  keyword_only: true
  condition:
    keywords: ["谢谢", "感谢", "thanks"]
  templates:
    - "不客气！能帮到你我很开心。"
    - "别客气，随时找我聊天哦。"
    - "小事一桩，有什么问题再来问我。"

# =============================================================================
# 模块六：万能回复 (Fallback)
# =============================================================================

- intent: fallback
  priority: 10
  condition: null
  templates:
    - "原来是这样啊。"
    - "唔，我在听。"
    - "能再多说一些吗？"
    - "这很有趣，继续说。"
    - "我理解你的感受。"
    - "嗯，我明白了。"
