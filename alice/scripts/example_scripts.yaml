# Alice 示例脚本库
# 展示各种脚本功能的实际应用

# =============================================================================
# 基础对话示例
# =============================================================================

- intent: greeting_response
  priority: 80
  condition:
    keywords: ["你好", "您好", "hi", "hello"]
  templates:
    - "你好！很高兴见到你，今天过得怎么样？"
    - "嗨！有什么我可以帮助你的吗？"
    - "你好呀！想聊些什么呢？"

- intent: farewell_response
  priority: 75
  condition:
    keywords: ["再见", "拜拜", "bye", "下次见"]
  templates:
    - "再见！希望我们的对话对你有帮助。"
    - "拜拜！随时欢迎你回来聊天。"
    - "下次见！保重哦～"

# =============================================================================
# 情感支持示例
# =============================================================================

- intent: empathy_positive
  priority: 85
  condition:
    sentiment_label: "positive"
    keywords: ["开心", "高兴", "快乐", "兴奋"]
  templates:
    - "哇，听得出你现在很开心！这种好心情是因为什么呢？"
    - "真为你高兴！能分享一下让你这么开心的事情吗？"
    - "这种愉悦的感觉一定很棒吧？是怎么产生的呢？"

- intent: empathy_negative
  priority: 90
  condition:
    sentiment_label: "negative"
    keywords: ["难过", "伤心", "痛苦", "沮丧"]
  templates:
    - "听起来你现在很难受，想聊聊具体发生了什么吗？"
    - "我能感受到你的痛苦，这种感觉一定很不好受。"
    - "难过的时候有人陪伴很重要，你还好吗？"

- intent: anxiety_support
  priority: 88
  condition:
    emotion_type: "anxiety"
    keywords: ["担心", "焦虑", "害怕", "紧张"]
  templates:
    - "焦虑的感觉确实不好受，你现在最担心的是什么呢？"
    - "我理解你的担心，能具体说说让你焦虑的事情吗？"
    - "这种不安的感觉持续多久了？有什么缓解的方法吗？"

# =============================================================================
# 好奇心驱动示例
# =============================================================================

- intent: person_inquiry
  priority: 75
  condition:
    entities: ["person", "third_person"]
  templates:
    - "你提到的{person}，在你的生活中扮演什么角色呢？"
    - "听起来{person}对你很重要，能多说说ta吗？"
    - "{person}是个什么样的人？你们之间有什么特别的故事吗？"

- intent: location_interest
  priority: 70
  condition:
    entities: ["location", "place"]
  templates:
    - "{location}那里给你留下了什么深刻印象？"
    - "能描述一下{location}是什么样子的吗？"
    - "在{location}的经历中，最难忘的是什么？"

- intent: event_followup
  priority: 65
  condition:
    keywords: ["发生", "遇到", "经历", "碰到"]
    pos_tags: ["VERB"]
  templates:
    - "这件事对你产生了什么影响？"
    - "当时的感受现在还记得很清楚吗？"
    - "从这次经历中学到了什么宝贵的教训？"

# =============================================================================
# 叙事助推示例
# =============================================================================

- intent: story_continuation
  priority: 60
  condition:
    min_tokens: 8
  templates:
    - "然后呢？我很想知道后续发展。"
    - "接下来发生了什么有趣的事情？"
    - "这个故事还有精彩的后续吗？"

- intent: detail_enhancement
  priority: 55
  condition:
    keywords: ["但是", "不过", "然而", "可是"]
  templates:
    - "哦？这里有个转折，能详细说说吗？"
    - "听起来有不同寻常的地方呢，具体情况是怎样的？"
    - "这个转折很有意思，我想了解更多细节。"

- intent: timeline_probe
  priority: 50
  condition:
    keywords: ["昨天", "今天", "明天", "那时候"]
  templates:
    - "那个时间点发生了什么特别的事情吗？"
    - "能说说当时的具体情况吗？"
    - "这段时间的变化让你有什么感受？"

# =============================================================================
# 专业话题示例
# =============================================================================

- intent: career_discussion
  priority: 65
  condition:
    keywords: ["工作", "职业", "上班", "面试", "升职"]
  templates:
    - "职场话题总是很有意思，你现在的工作状态怎么样？"
    - "工作上的挑战和机遇并存呢，最近有什么新的体验吗？"
    - "职业发展是人生重要课题，你对未来有什么规划吗？"

- intent: learning_inquiry
  priority: 60
  condition:
    keywords: ["学习", "读书", "考试", "知识"]
  templates:
    - "学习是个持续的过程，最近在学什么有趣的东西吗？"
    - "求知欲让人保持年轻呢，什么知识最吸引你？"
    - "学习中的收获和困惑都很宝贵，愿意分享一下吗？"

- intent: creative_expression
  priority: 55
  condition:
    keywords: ["写作", "画画", "音乐", "创作"]
  templates:
    - "艺术创作为生活增添色彩呢，最近有什么作品吗？"
    - "创意表达是内心世界的窗口，你的创作灵感来自哪里？"
    - "艺术之旅充满惊喜，创作过程中有什么特别的体验吗？"

# =============================================================================
# 日常生活示例
# =============================================================================

- intent: daily_life_sharing
  priority: 45
  condition:
    keywords: ["吃饭", "睡觉", "运动", "购物"]
  templates:
    - "日常生活的小确幸也很珍贵呢，今天有什么特别的安排吗？"
    - "平凡日子也有不平凡的精彩，能分享一下今天的日常吗？"
    - "生活节奏反映内心状态，最近的生活节奏怎么样？"

- intent: hobby_interest
  priority: 50
  condition:
    keywords: ["爱好", "兴趣", "喜欢", "热爱"]
  templates:
    - "兴趣爱好让生活更丰富呢，你最喜欢做什么？"
    - "找到热爱的事情很幸福，能说说你的兴趣吗？"
    - "业余时光怎样度过最能体现一个人的品味呢。"

# =============================================================================
# 兜底回应示例
# =============================================================================

- intent: general_fallback
  priority: 20
  condition: null  # 无条件匹配，作为最后的选择
  templates:
    - "嗯，我明白了。能再多说一些吗？"
    - "这很有趣，继续说下去吧。"
    - "我理解你的感受，还有其他想分享的吗？"
    - "为什么会这样想呢？能详细解释一下吗？"
    - "这个观点很有意思，你是怎么看的？"

- intent: clarification_request
  priority: 25
  condition:
    max_tokens: 5  # 简短输入
  templates:
    - "能再详细说说吗？我想更好地理解你的想法。"
    - "可以多分享一些细节吗？这样我能给出更好的回应。"
    - "你的意思是...？我想确认一下理解是否正确。"

# =============================================================================
# 特殊功能示例
# =============================================================================

- intent: keyword_only_example
  priority: 70
  condition:
    keywords: ["天气", "下雨", "晴天"]
  templates:
    - "天气变化确实会影响心情呢。"
    - "最近天气怎么样？"
  keyword_only: true  # 不进行代词替换

- intent: reassembly_example
  priority: 65
  condition:
    keywords: ["我觉得", "我认为", "我相信"]
  templates:
    - "你为什么{1}呢？"
    - "是什么让你有这样的想法{1}？"
  # 默认 keyword_only: false，会进行代词替换