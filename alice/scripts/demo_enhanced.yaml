- intent: greeting
  priority: 100
  condition:
    keywords: ["你好", "您好", "嗨"]  # 匹配问候语
  templates:
    - "你好。"
    - "Hi"
    - "嗨"


- intent: self_introduction
  priority: 75
  condition:
    entities: ["PERSON", "TITLE"]  # 匹配人名或称谓
    keywords: ["我"]
  templates:
    - "{PERSON}，你好呀！"
    - "原来是{PERSON}。你这么闲？"


- intent: person_interest
  priority: 70
  condition:
    entities: ["PERSON", "TITLE"]  # 匹配人名或称谓
  templates:
    - "{PERSON}是谁？"
    - "{PERSON}是你的什么人？"

- intent: ongoing_chat
  priority: 60
  condition:
    min_turns: 5  # 5 轮后匹配
  templates:
    - "{turn_count}轮了，还没看出来？"
    - "快做决定吧，已经聊了{turn_count}轮了！"


# 新增：语义角色标注示例
- intent: semantic_role_example
  priority: 80
  condition:
    semantic_roles: ["A0", "A1"]  # 匹配施事和受事角色
  templates:
    - "你觉得{role_A0}怎么样？"
    - "对于{role_A1}你有什么想法？"
    - "能说说关于{role_A0}和{role_A1}的事情吗？"


# 新增：语义依存分析示例
- intent: semantic_dependency_example
  priority: 75
  condition:
    semantic_deps: ["TMP", "LOC", "CAU"]  # 匹配时间、地点、原因语义依存
  templates:
    - "关于{sdp_TMP}你有什么想说的？"
    - "在{sdp_LOC}发生了什么？"
    - "是因为{sdp_CAU}吗？"
    - "能详细说说{sdp_TMP}在{sdp_LOC}因为{sdp_CAU}发生的事情吗？"


# 新增：复杂语义分析示例
- intent: complex_semantic_analysis
  priority: 85
  condition:
    semantic_roles: ["A0", "A1"]
    semantic_deps: ["TMP", "LOC"]
    min_tokens: 6
  templates:
    - "你在{sdp_LOC}关于{role_A0}对{role_A1}的{sdp_TMP}做了什么？"
    - "{role_A0}在{sdp_LOC}对{role_A1}的{sdp_TMP}有何影响？"