# Alice 情感驱动脚本库 - YAML 格式
# 基于情感分析结果生成共情回应
# 
# 使用方式:
#   在 dialogue_engine 中加载此脚本，配合情感分析引擎使用
#
# 情感标签说明:
#   - positive: 正面情感（开心、高兴、幸福等）
#   - negative: 负面情感（难过、生气、焦虑等）
#   - neutral: 中性情感
#   - joy: 喜悦
#   - anger: 愤怒
#   - sadness: 悲伤
#   - fear: 恐惧
#   - anxiety: 焦虑
#   - disgust: 厌恶
#   - surprise: 惊讶

# =============================================================================
# 模块一：基础情感回应 (Basic Emotional Responses)
# =============================================================================

- intent: sentiment_positive
  priority: 85
  condition:
    sentiment_label: "positive"
  templates:
    - "哇，听得出你现在心情不错！这种好心情是因为什么呢？"
    - "太好了！这种开心的感觉真棒，能多跟我分享一下吗？"
    - "真为你高兴！这种时候最想和谁分享呢？"
    - "听起来很棒！这种感觉让你想到了什么？"
    - "这种美好的感觉，一定很珍贵吧？"

- intent: sentiment_negative
  priority: 90
  condition:
    sentiment_label: "negative"
  templates:
    - "听起来那阵子你挺不容易的，那种感觉现在还在吗？"
    - "我能感受到你的难过，想和我多说说吗？"
    - "这种情况确实让人难受，你是怎么应对的呢？"
    - "我在这里陪着你，想说什么都可以。"
    - "唔...我听着呢。继续说，我在。"

- intent: sentiment_neutral
  priority: 65
  condition:
    sentiment_label: "neutral"
  templates:
    - "嗯，我明白了。能再多说一些吗？"
    - "原来是这样啊。然后呢？"
    - "唔，我在听。"

# =============================================================================
# 模块二：细粒度情感回应 (Specific Emotion Responses)
# =============================================================================

- intent: emotion_joy
  priority: 88
  condition:
    emotion_type: "joy"
  templates:
    - "你高兴啥呢？"
    - "太好了！这种快乐的感觉一定很美妙吧？"
    - "这种开心的时刻，最想和谁一起分享？"
    - "哇！能多说说为什么这么高兴吗？"

- intent: emotion_anger
  priority: 92
  condition:
    emotion_type: "anger"
  templates:
    - "听起来这件事让你很生气，能说说发生了什么吗？"
    - "我理解你的感受，遇到这种事确实会让人恼火。"
    - "这种愤怒的感觉，是从什么时候开始的？"
    - "被人这样对待，生气是很正常的反应。想多聊聊吗？"

- intent: emotion_sadness
  priority: 93
  condition:
    emotion_type: "sadness"
  templates:
    - "你为什么伤心？"
    - "这种悲伤的感觉一定很难熬，我在这里陪着你。"
    - "失去重要的东西，感到伤心是很自然的。"
    - "想哭就哭出来吧，我陪着你。"

- intent: emotion_fear
  priority: 91
  condition:
    emotion_type: "fear"
  templates:
    - "听起来这件事让你有些害怕，能告诉我更多吗？"
    - "别担心，我在这里。这种担心是从哪里来的呢？"
    - "害怕是一种保护自己的情绪，不用觉得羞耻。"
    - "能说说具体在担心什么吗？"

- intent: emotion_anxiety
  priority: 90
  condition:
    emotion_type: "anxiety"
  templates:
    - "听起来你有些焦虑，这种感觉是什么时候开始的？"
    - "我理解这种不安的感觉，想和我聊聊吗？"
    - "焦虑的时候，深呼吸一下会好一些。要试试吗？"
    - "这种忐忑的感觉一定很难受，能说说是因为什么吗？"

- intent: emotion_disgust
  priority: 87
  condition:
    emotion_type: "disgust"
  templates:
    - "听起来这件事让你很反感，能说说为什么吗？"
    - "我理解你的感受，遇到这种事确实让人不舒服。"
    - "厌恶是一种保护自己边界的情绪，很正常。"
    - "不想接近让自己不舒服的东西，这是很自然的反应。"

- intent: emotion_surprise
  priority: 82
  condition:
    emotion_type: "surprise"
    keywords: ["意外", "惊讶", "没想到", "吃惊", "震惊", "惊喜"]
  templates:
    - "哇，这真是个意外！当时你是怎么反应的？"
    - "听起来很令人惊讶，接下来发生了什么？"
    - "这种意外的感觉，让你想到了什么？"
    - "没想到会这样！然后呢？"

# =============================================================================
# 模块三：情感强度回应 (Emotional Intensity Responses)
# =============================================================================

- intent: emotion_strong
  priority: 86
  condition:
    sentiment_intensity: "strong"
    sentiment_label: "negative"
  templates:
    - "听起来这件事对你影响真的很大，一定很难熬吧？"
    - "我能感受到你的痛苦非常强烈，想多说说吗？"
    - "这种非常难受的感觉，是从什么时候开始的？"

- intent: emotion_moderate
  priority: 75
  condition:
    sentiment_intensity: "moderate"
  templates:
    - "听起来你有点困扰，能多说说是怎么回事吗？"
    - "这种感觉应该让你不太舒服吧？"

- intent: emotion_weak
  priority: 60
  condition:
    sentiment_intensity: "weak"
  templates:
    - "嗯，听起来你稍微有点在意这件事？"
    - "这种感觉应该不是很强烈，但还是让你有些想法吧？"

# =============================================================================
# 模块四：混合情感回应 (Mixed Emotion Responses)
# =============================================================================

- intent: emotion_mixed
  priority: 83
  condition:
    sentiment_label: "mixed"
  templates:
    - "你好像有两种不同的感受，这确实挺复杂的。"
    - "一边是这样，一边又是那样，这种纠结的感觉一定很难受吧？"
    - "人的感情本来就是复杂的，有矛盾的感觉很正常。"
    - "能说说为什么会有两种不同的感受吗？"

# =============================================================================
# 模块五：情感关键词回应 (Emotion Keyword Responses)
# =============================================================================

- intent: emotion_keyword_happy
  priority: 84
  condition:
    keywords: ["开心", "高兴", "快乐", "幸福", "兴奋"]
  templates:
    - "哇，听起来真的很棒！能多说说为什么这么开心吗？"
    - "真为你感到高兴！这种感觉一定很美好吧？"

- intent: emotion_keyword_sad
  priority: 89
  condition:
    keywords: ["难过", "伤心", "悲伤", "痛苦", "失望"]
  templates:
    - "我能感受到你的难过，想和我多说说吗？"
    - "这种感觉一定很难受，我在这里陪着你。"

- intent: emotion_keyword_angry
  priority: 88
  condition:
    keywords: ["生气", "愤怒", "恼火", "烦躁", "郁闷"]
  templates:
    - "听起来这件事让你很生气，能说说发生了什么吗？"
    - "我理解你的感受，遇到这种事确实会让人恼火。"

- intent: emotion_keyword_anxious
  priority: 87
  condition:
    keywords: ["焦虑", "紧张", "害怕", "担心", "不安"]
  templates:
    - "听起来你有些担心，这种感觉是什么时候开始的？"
    - "我理解这种不安的感觉，想和我聊聊吗？"

- intent: emotion_keyword_tired
  priority: 86
  condition:
    keywords: ["累", "疲惫", "疲倦", "困", "乏力"]
  templates:
    - "听起来你真的很累，要好好照顾自己啊。"
    - "疲惫的时候，休息一下是很重要的。最近休息得好吗？"

- intent: emotion_keyword_lonely
  priority: 90
  condition:
    keywords: ["孤独", "寂寞", "孤单", "无助"]
  templates:
    - "孤独的感觉确实很难受，但你不是一个人。"
    - "我在这里陪着你。想多聊聊你的感受吗？"

- intent: emotion_keyword_stressed
  priority: 88
  condition:
    keywords: ["压力", "压抑", "喘不过气", "吃不消"]
  templates:
    - "听起来你的压力真的很大，辛苦了。"
    - "压力大的时候，找个出口释放一下很重要。想聊聊吗？"

# =============================================================================
# 模块六：情感关怀回应 (Emotional Care Responses)
# =============================================================================

- intent: emotional_care_crisis
  priority: 100
  condition:
    keywords: ["想死", "不想活了", "自杀", "结束生命", "活不下去"]
    sentiment_label: "negative"
  templates:
    - "我听到你说这些话，真的很担心你。你现在安全吗？"
    - "你的生命很珍贵。如果感觉撑不住了，可以寻求专业帮助吗？"
    - "我知道现在可能很痛苦，但请相信情况会好起来的。"
    - "如果你需要紧急帮助，可以拨打心理援助热线：12355（青少年）或 12320（卫生热线）"
  # 注意：这是危机干预响应，应该触发特殊处理流程

- intent: emotional_care_support
  priority: 95
  condition:
    keywords: ["没人理解", "没人关心", "没人在乎", "被抛弃"]
  templates:
    - "我听到你这么说，真的很心疼。虽然我不在你身边，但我在听你说。"
    - "你对我来说很重要。你的感受、你的故事，我都很在意。"
    - "有时候我们会觉得被世界抛弃了，但这不是你的错。"
