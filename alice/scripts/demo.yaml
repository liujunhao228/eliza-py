- intent: greeting
  priority: 100
  condition:
    keywords: ["你好", "您好", "嗨"]  # 匹配问候语
  templates:
    - "你好。"
    - "Hi"
    - "嗨"


- intent: self_introduction
  priority: 75
  condition:
    entities: ["PERSON", "TITLE"]  # 匹配人名或称谓
    keywords: ["我"]
  templates:
    - "{PERSON}，你好呀！"
    - "原来是{PERSON}。你这么闲？"


- intent: self_introduction
  priority: 75
  condition:
    entities: ["PERSON", "TITLE"]  # 匹配人名或称谓
    keywords: ["我"]
  templates:
    - "{PERSON}，你好呀！"
    - "原来是{PERSON}。你这么闲？"


- intent: person_interest
  priority: 70
  condition:
    entities: ["PERSON", "TITLE"]  # 匹配人名或称谓
  templates:
    - "{PERSON}是谁？"
    - "{PERSON}是你的什么人？"

- intent: ongoing_chat
  priority: 60
  condition:
    min_turns: 5  # 5 轮后匹配
  templates:
    - "{turn_count}轮了，还没看出来？"
    - "快做决定吧，已经聊了{turn_count}轮了！"








