# Alice 映射规则配置文件
# 包含代词映射和句式转换规则

# =============================================================================
# 代词映射配置
# =============================================================================
pronoun_mapping:
  # 基本人称代词
  "我": "你"
  "我的": "你的"
  "我们": "你们"
  "我自己": "你自己"

  # 家庭成员
  "我妈": "你妈"
  "我爸": "你爸"
  "我老婆": "你老婆"
  "我老公": "你老公"
  "我朋友": "你朋友"
  "我同事": "你同事"
  "我同学": "你同学"
  "我老板": "你老板"
  "我老师": "你老师"
  "我孩子": "你孩子"
  "我儿子": "你儿子"
  "我女儿": "你女儿"
  "我哥哥": "你哥哥"
  "我弟弟": "你弟弟"
  "我姐姐": "你姐姐"
  "我妹妹": "你妹妹"

  # 家庭相关
  "我家": "你家"
  "我家里的": "你家里的"


# =============================================================================
# 句式转换规则
# 格式：[匹配模式，响应模板]
# =============================================================================
transformation_rules:
  - ["我觉得 (.*)", "你为什么觉得{1}呢？"]
  - ["我感到 (.*)", "你为什么感到{1}呢？"]
  - ["我认为 (.*)", "你为什么认为{1}呢？"]
  - ["我想 (.*)", "为什么想{1}呢？"]
  - ["我喜欢 (.*)", "你喜欢{1}什么地方？"]
  - ["我讨厌 (.*)", "为什么讨厌{1}呢？"]
  - ["我害怕 (.*)", "{1}让你感到害怕吗？"]
  - ["我希望 (.*)", "为什么希望{1}呢？"]
  - ["我担心 (.*)", "你担心{1}的原因是什么？"]
  - ["我不 (.*)", "为什么不{1}呢？"]
  - ["我不能 (.*)", "你怎么知道自己不能{1}呢？"]
  - ["我不想 (.*)", "为什么不想{1}呢？"]
  - ["我需要 (.*)", "为什么需要{1}呢？"]
  - ["我想要 (.*)", "为什么想要{1}呢？"]
  - ["我总是 (.*)", "真的总是{1}吗？能举个例子吗？"]
  - ["我从不 (.*)", "真的从不{1}吗？"]
  - ["我有时候 (.*)", "什么时候会{1}呢？"]
  - ["我经常 (.*)", "经常{1}啊，能具体说说吗？"]
  - ["我觉得自己 (.*)", "你为什么觉得自己{1}呢？"]
  - ["我觉得我 (.*)", "你为什么觉得{1}呢？"]
