[project]
name = "eliza-py"
version = "0.1.0"
description = "Alice 聊天机器人和图灵测试平台"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Eliza-Py Team" }
]
keywords = ["chatbot", "nlp", "turing-test", "alice", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # 核心依赖
    "jieba>=0.42.1,<0.43.0",
    "PyYAML>=6.0.3,<7.0.0",
    # Web 框架（允许小版本更新以获取安全补丁）
    "fastapi>=0.104.0,<0.110.0",
    "uvicorn[standard]>=0.24.0,<0.26.0",
    "python-multipart>=0.0.6,<0.1.0",
    "flask>=2.3.2,<3.0.0",
    "gunicorn>=21.2.0,<22.0.0",
    "websockets>=12.0,<13.0.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.23,<2.1.0",
    "aiosqlite>=0.19.0,<0.20.0",
    # 数据验证
    "pydantic>=2.5.2,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    # HTTP 客户端
    "httpx>=0.25.2,<0.27.0",
    # 工具库
    "loguru>=0.7.0,<0.8.0",
    "rich>=13.4.2,<14.0.0",
    "passlib>=1.7.4",
    "python-jose>=3.5.0,<4.0.0",
    # Lua 支持
    "lupa>=2.1,<3.0",
    "restrictedpython>=6.0,<7.0",
    "pytest>=7.4.0,<8.0.0",
    "bcrypt>=5.0.0,<6.0.0",
    "slowapi>=0.1.9,<0.2.0",
    "sentry-sdk[fastapi]>=1.40.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
# NLP 引擎 (必需增强)
# 注意：torch 和 sentence-transformers 版本需要兼容
# torch 2.1.x - 2.2.x 与 sentence-transformers 2.2.x - 2.3.x 兼容
nlp = [
    "ltp==4.2.14",
    "torch>=2.1.0,<2.3.0",
    "torchvision>=0.16.0,<0.18.0",
    "sentence-transformers>=2.2.0,<2.4.0",
]

# 测试工具
test = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.21.1,<0.23.0",
]

# 开发工具
dev = [
    "black>=23.7.0,<25.0.0",
    "flake8>=6.0.0,<7.0.0",
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.21.1,<0.23.0",
]

# 完整依赖 (包含所有可选依赖)
all = [
    "ltp==4.2.14",
    "torch>=2.1.0,<2.3.0",
    "torchvision>=0.16.0,<0.18.0",
    "sentence-transformers>=2.2.0,<2.4.0",
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-asyncio>=0.21.1,<0.23.0",
    "black>=23.7.0,<25.0.0",
    "flake8>=6.0.0,<7.0.0",
]

[project.scripts]
alice-server = "alice.server:app"
turing-backend = "start_backend:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alice*", "config*", "turing_test*", "bots*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# 测试覆盖率配置
[tool.coverage.run]
source = ["alice", "config", "turing_test", "bots"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]
