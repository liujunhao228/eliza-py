[project]
name = "eliza-py"
version = "0.1.0"
description = "Alice 聊天机器人和图灵测试平台"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Eliza-Py Team" }
]
keywords = ["chatbot", "nlp", "turing-test", "alice", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # 核心依赖
    "jieba==0.42.1",
    "PyYAML==6.0.3",
    # Web 框架
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "flask==2.3.2",
    "gunicorn==21.2.0",
    "websockets==12.0",
    # 数据库
    "sqlalchemy[asyncio]==2.0.23",
    "aiosqlite==0.19.0",
    # 数据验证
    "pydantic==2.5.2",
    "pydantic-settings==2.1.0",
    # HTTP 客户端
    "httpx==0.25.2",
    # 工具库
    "loguru==0.7.0",
    "rich==13.4.2",
    "passlib>=1.7.4",
    "python-jose>=3.5.0",
    # Lua 支持
    "lupa>=2.1",
    "restrictedpython>=6.0",
    "pytest>=7.4.0",
    "bcrypt>=5.0.0",
    "slowapi==0.1.9",
    "sentry-sdk[fastapi]==1.40.0",
]

[project.optional-dependencies]
# NLP 引擎 (必需增强)
nlp = [
    "ltp==4.2.14",
    "sentence-transformers==2.2.2",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

# 测试工具
test = [
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.21.1",
]

# 开发工具
dev = [
    "black==23.7.0",
    "flake8==6.0.0",
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.21.1",
]

# 完整依赖 (包含所有可选依赖)
all = [
    "ltp==4.2.14",
    "sentence-transformers==2.2.2",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.21.1",
    "black==23.7.0",
    "flake8==6.0.0",
]

[project.scripts]
alice-server = "alice.server:app"
turing-backend = "start_backend:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alice*", "config*", "turing_test*", "bots*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]
