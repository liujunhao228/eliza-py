# =============================================================================
# Alice 模块配置
# =============================================================================
# 说明：此文件包含 Alice 模块的所有配置项
# =============================================================================

# -----------------------------------------------------------------------------
# 功能开关
# -----------------------------------------------------------------------------
enable_ltp: true                      # 启用 LTP 句法分析
enable_ner: true                      # 启用 NER 实体识别
enable_log: true                      # 启用对话日志
ner_use_ltp: true                     # NER 使用 LTP 增强

# -----------------------------------------------------------------------------
# 脚本引擎配置
# -----------------------------------------------------------------------------
scripting:
  enable_lua: true
  enable_yaml: true

  lua:
    script_dir: scripts/lua
    metadata_file: scripts/lua/metadata.yaml
    sandbox_mode: true
    max_execution_time: 1.0
    cache_size: 100

  yaml:
    script_file: scripts/yaml/demo.yaml   # 默认配置
    opening_script_file: scripts/opening.yaml  # 开场白脚本

  rules_file: scripts/mapping/mapping.yaml

# -----------------------------------------------------------------------------
# 对话上下文配置
# -----------------------------------------------------------------------------
context_max_items: 10
conversation_history_max_turns: 20
ltp_cache_size_limit: 100
dialogue_log_max_entries: 1000

# -----------------------------------------------------------------------------
# 性能配置
# -----------------------------------------------------------------------------
performance_monitor_sample_rate: 1.0
max_input_length: 500
script_match_timeout: 100             # 毫秒
regex_cache_size: 100

# -----------------------------------------------------------------------------
# 预定义响应
# -----------------------------------------------------------------------------
fallback_responses:
  - "嗯，我明白了。这里是默认回答。"
greeting_responses:
  - "你好！这里是默认回答"

# -----------------------------------------------------------------------------
# 日志配置
# -----------------------------------------------------------------------------
log_max_size_mb: 10
log_backup_count: 5

# -----------------------------------------------------------------------------
# LTP 引擎配置 (共享)
# -----------------------------------------------------------------------------
ltp:
  enable_cws: true                    # 词分词
  enable_pos: true                    # 词性标注
  enable_ner: true                    # 命名实体识别
  enable_dep: true                    # 依存句法分析
  enable_sdp: true                    # 语义依存分析
  enable_srl: true                    # 语义角色标注
  cache_size: 50
  max_length: 512
